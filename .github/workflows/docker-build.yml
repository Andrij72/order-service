name: Build, Test & Dockerize Order Service

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/order-service

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21 + Maven cache
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Setup Maven settings and Build JAR
        run: |
          mkdir -p $HOME/.m2
          cat > $HOME/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                    https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${{ secrets.MAVEN_USERNAME }}</username>
                <password>${{ secrets.MAVEN_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF
          
          mvn clean verify -B -s $HOME/.m2/settings.xml      
          ls -l target

        # --- Docker login
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      # --- Build & Push Docker image
      - name: Extract short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build & Push Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:dev-latest .
          docker tag ${{ env.DOCKER_IMAGE }}:dev-latest ${{ env.DOCKER_IMAGE }}:dev-${{ env.SHORT_SHA }}
          docker push ${{ env.DOCKER_IMAGE }}:dev-latest
          docker push ${{ env.DOCKER_IMAGE }}:dev-${{ env.SHORT_SHA }}

      - name: Run containers for E2E
        run: |
          docker network create test-network || true

          docker run -d --name mysql \
            --network test-network \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=testdb \
            -e MYSQL_USER=testuser \
            -e MYSQL_PASSWORD=testpass \
            mysql:8.0.32

          echo "Waiting for MySQL..."
          sleep 15

          docker run -d --name order-service \
            --network test-network \
            -p 8083:8083 \
            -e SPRING_PROFILES_ACTIVE=docker \
            -e SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/testdb \
            -e SPRING_DATASOURCE_USERNAME=testuser \
            -e SPRING_DATASOURCE_PASSWORD=testpass \
            ${{ env.DOCKER_IMAGE }}:dev-latest

      - name: Wait for Order Service
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8083/actuator/health | grep UP; then
              echo "Service is UP"
              exit 0
            fi
            echo "Waiting..."
            docker logs order-service | tail -20
            sleep 5
          done
          echo "Service failed"
          docker logs order-service
          exit 1

      - name: API test
        run: curl -f http://localhost:8083/api/v1/orders